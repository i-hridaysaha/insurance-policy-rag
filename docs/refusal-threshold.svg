<svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Overlapping retrieval-score ranges for answerable and unanswerable questions">
  <title>Retrieval score cannot tell answerable from unanswerable</title>
  <desc>Answerable questions score 0.341 to 0.647, median 0.546. Unanswerable questions score 0.479 to 0.640. The ranges overlap, so the strictest threshold that rejects all three unanswerable questions still rejects 29 of the 31 answerable ones; only 2 answerable score above it.</desc>

  <rect x="8" y="8" width="984" height="504" rx="14" fill="#FAFAF7" stroke="#E6E6DF" stroke-width="1"/>

  <text x="56" y="56" font-size="24" font-weight="700" fill="#16181D">Retrieval score cannot tell answerable from unanswerable</text>
  <text x="56" y="84" font-size="14" fill="#6B7280">Top retrieval score per question. The two ranges overlap almost completely.</text>

  <!-- overlap band -->
  <rect x="480" y="150" width="306" height="250" fill="#EDEDE8"/>
  <text x="633" y="142" font-size="12" fill="#9AA0A8" text-anchor="middle">overlap</text>

  <!-- answerable range bar (0.341 to 0.647) -->
  <text x="224" y="196" font-size="12.5" font-weight="700" fill="#2a6ab0">31 answerable questions</text>
  <rect x="217.9" y="210" width="581.4" height="46" rx="23" fill="#2a78d6" fill-opacity="0.16" stroke="#2a78d6" stroke-width="1.8"/>
  <!-- the sliver right of the line: the 2 answerable questions that survive the threshold -->
  <rect x="786" y="210" width="13.3" height="46" fill="#2a78d6" fill-opacity="0.9"/>
  <line x1="607.4" y1="206" x2="607.4" y2="260" stroke="#2a78d6" stroke-width="3"/>
  <text x="210" y="238" font-size="11" fill="#6B7280" text-anchor="end">0.341</text>
  <text x="799.3" y="200" font-size="11" fill="#6B7280" text-anchor="middle">0.647</text>
  <text x="607.4" y="280" font-size="11" fill="#6B7280" text-anchor="middle">median 0.546</text>

  <!-- unanswerable range bar (0.479 to 0.640) -->
  <text x="486" y="306" font-size="12.5" font-weight="700" fill="#b8532b">3 unanswerable questions</text>
  <rect x="480.1" y="320" width="305.9" height="46" rx="23" fill="#eb6834" fill-opacity="0.18" stroke="#eb6834" stroke-width="1.8"/>
  <text x="472" y="348" font-size="11" fill="#6B7280" text-anchor="end">0.479</text>
  <text x="794" y="348" font-size="11" fill="#6B7280">0.640</text>

  <!-- threshold: strictest line that rejects all 3 unanswerable, at 0.64 -->
  <line x1="786" y1="168" x2="786" y2="400" stroke="#F0FF00" stroke-width="5"/>
  <line x1="786" y1="168" x2="786" y2="400" stroke="#16181D" stroke-width="1"/>
  <text x="778" y="186" font-size="12" font-weight="700" fill="#16181D" text-anchor="end">reject all 3 unanswerable</text>
  <text x="778" y="202" font-size="11" fill="#6B7280" text-anchor="end">the line sits at 0.64</text>

  <!-- survivor callout: the blue sliver past the line is deliberate, not a rendering slip -->
  <line x1="811" y1="233" x2="800" y2="233" stroke="#2a6ab0" stroke-width="1.4"/>
  <text x="815" y="230" font-size="12" font-weight="700" fill="#2a6ab0">2 of 31 clear</text>
  <text x="815" y="246" font-size="12" font-weight="700" fill="#2a6ab0">the line</text>
  <text x="815" y="264" font-size="11" fill="#6B7280">(above 0.64)</text>

  <!-- rejected callout -->
  <text x="450" y="238" font-size="11.5" font-weight="600" fill="#2a6ab0" text-anchor="middle">29 of 31 fall below the line</text>

  <!-- axis -->
  <line x1="140" y1="400" x2="900" y2="400" stroke="#CBCFD6" stroke-width="1.2"/>
  <g font-size="11.5" fill="#9AA0A8" text-anchor="middle">
    <text x="140" y="422">0.30</text><text x="330" y="422">0.40</text><text x="520" y="422">0.50</text><text x="710" y="422">0.60</text><text x="900" y="422">0.70</text>
  </g>
  <text x="520" y="448" font-size="12" fill="#9AA0A8" text-anchor="middle">top retrieval score</text>

  <text x="56" y="482" font-size="12.5" fill="#6B7280">A line strict enough to reject all 3 unanswerable questions also rejects 29 of the 31 answerable ones. Retrieval similarity measures</text>
  <text x="56" y="500" font-size="12.5" fill="#6B7280">topical relatedness; answerability is a different property. So refusal is the model's judgment, not a score threshold.</text>
</svg>
