<svg width="620" viewBox="0 0 620 712" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Insurance Policy RAG architecture">
  <title>Insurance Policy RAG architecture</title>
  <desc>A policy PDF is chunked by clause and indexed offline. Per question, hybrid retrieval (Sentence-BERT + FAISS and BM25, fused by RRF) returns the top five clauses; a local LLM answers only from those clauses; every cited clause is verified against the retrieved context; the result is an answer or a refusal.</desc>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#9AA0A8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- clip the accent bar to each box's inner area so it follows the rounded corners and stays inside the border -->
    <clipPath id="tb6"><rect x="171" y="493" width="278" height="50" rx="8"/></clipPath>
    <clipPath id="tb7"><rect x="171" y="567" width="278" height="46" rx="8"/></clipPath>
  </defs>

  <!-- self-contained card background: keeps the diagram readable on light AND dark pages -->
  <rect x="8" y="8" width="604" height="696" rx="14" fill="#FAFAF7" stroke="#E6E6DF" stroke-width="1"/>

  <!-- heading -->
  <text x="310" y="46" text-anchor="middle" font-size="17" font-weight="700" fill="#16181D">Insurance Policy RAG</text>
  <text x="310" y="66" text-anchor="middle" font-size="11.5" fill="#6B7280">retrieval → grounded generation → verified answer or refusal</text>

  <!-- stage labels -->
  <g font-size="10.5" fill="#9AA0A8" font-weight="700" letter-spacing="1.5">
    <text x="170" y="98">INGEST</text>
    <text x="170" y="254">RETRIEVE</text>
    <text x="170" y="410">GENERATE</text>
  </g>
  <!-- right-side qualifiers, clear of the centre connector -->
  <g font-size="10.5" fill="#B4B8BE" font-weight="600" text-anchor="end">
    <text x="450" y="98">once, offline</text>
    <text x="450" y="254">per question</text>
    <text x="450" y="410">FastAPI /ask</text>
  </g>

  <!-- connectors -->
  <g stroke="#9AA0A8" stroke-width="1.6" fill="none">
    <line x1="310" y1="150" x2="310" y2="170" marker-end="url(#arw)"/>
    <line x1="310" y1="224" x2="310" y2="254" marker-end="url(#arw)"/>
    <line x1="310" y1="312" x2="310" y2="334" marker-end="url(#arw)"/>
    <line x1="310" y1="380" x2="310" y2="410" marker-end="url(#arw)"/>
    <line x1="310" y1="468" x2="310" y2="490" marker-end="url(#arw)"/>
    <line x1="310" y1="544" x2="310" y2="566" marker-end="url(#arw)"/>
  </g>

  <!-- neutral pipeline boxes -->
  <g>
    <rect x="170" y="106" width="280" height="44" rx="9" fill="#FFFFFF" stroke="#CBCFD6" stroke-width="1.4"/>
    <text x="310" y="133" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Policy PDF · 291 pages</text>

    <rect x="170" y="172" width="280" height="52" rx="9" fill="#FFFFFF" stroke="#CBCFD6" stroke-width="1.4"/>
    <text x="310" y="195" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Clause chunking + Annexure A matrix</text>
    <text x="310" y="212" text-anchor="middle" font-size="11" fill="#6B7280">boilerplate stripped · rate charts excluded</text>

    <rect x="170" y="256" width="280" height="56" rx="9" fill="#FFFFFF" stroke="#CBCFD6" stroke-width="1.4"/>
    <text x="310" y="281" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Hybrid retrieval</text>
    <text x="310" y="299" text-anchor="middle" font-size="11" fill="#6B7280">Sentence-BERT + FAISS  ⊕  BM25  ·  fused by RRF</text>

    <rect x="170" y="336" width="280" height="44" rx="9" fill="#FFFFFF" stroke="#CBCFD6" stroke-width="1.4"/>
    <text x="310" y="363" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Top-5 clauses</text>

    <rect x="170" y="412" width="280" height="56" rx="9" fill="#FFFFFF" stroke="#CBCFD6" stroke-width="1.4"/>
    <text x="310" y="437" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Local LLM · Ollama</text>
    <text x="310" y="455" text-anchor="middle" font-size="11" fill="#6B7280">qwen2.5-14b · answers only from the clauses</text>
  </g>

  <!-- trust mechanisms: dark border + neon brand bar -->
  <g>
    <rect x="170" y="492" width="280" height="52" rx="9" fill="#FFFFFF" stroke="#16181D" stroke-width="1.8"/>
    <rect x="171" y="493" width="7" height="50" fill="#F0FF00" clip-path="url(#tb6)"/>
    <text x="310" y="515" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Citation verification</text>
    <text x="310" y="532" text-anchor="middle" font-size="11" fill="#6B7280">every cited clause ⊆ retrieved context</text>

    <rect x="170" y="566" width="280" height="48" rx="9" fill="#FFFFFF" stroke="#16181D" stroke-width="1.8"/>
    <rect x="171" y="567" width="7" height="46" fill="#F0FF00" clip-path="url(#tb7)"/>
    <text x="310" y="595" text-anchor="middle" font-size="14" font-weight="600" fill="#16181D">Answered   ·   or   ·   Refused</text>
  </g>

  <!-- legend + honest callout -->
  <rect x="196" y="642" width="12" height="12" rx="3" fill="#F0FF00" stroke="#16181D" stroke-width="1"/>
  <text x="214" y="652" font-size="10.5" fill="#16181D" font-weight="600">= trust mechanism</text>
  <text x="310" y="674" text-anchor="middle" font-size="11" fill="#6B7280">Refusal is the model's judgment, not a score threshold.</text>
  <text x="310" y="690" text-anchor="middle" font-size="11" fill="#6B7280">Citations are verified against the retrieved clauses, never trusted.</text>
</svg>
