name: keep-warm

# Free HuggingFace Spaces sleep after ~48h idle; the first visitor after that waits ~30-60s for the
# container to wake and load the embedding model. For a portfolio "Live demo" link that is a poor
# first impression, so this pings the Space's /health on a schedule to keep it warm.
#
# Setup: add a repository variable SPACE_URL (Settings -> Secrets and variables -> Actions ->
# Variables) set to the Space's base URL, e.g. https://<your-hf-username>-insurance-policy-rag.hf.space
#
# Note: scheduled workflows only run from the repository's DEFAULT branch, so this takes effect once
# it is on main.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Space /health
        run: |
          url="${{ vars.SPACE_URL }}"
          if [ -z "$url" ]; then
            echo "Repository variable SPACE_URL is not set; nothing to ping."
            exit 0
          fi
          echo "Pinging ${url%/}/health"
          curl -fsS --max-time 180 "${url%/}/health" && echo && echo "Space is awake."
